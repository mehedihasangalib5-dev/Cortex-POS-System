    if (localStorage.getItem('theme') === 'dark' ||
        (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    }

<body class="font-sans" data-page="pos">
<header class="surface-glass sticky top-0 z-30 px-3 sm:px-6 py-3 sm:py-3.5 flex items-center justify-between gap-2 sm:gap-4" style="border-radius:0">
<div class="flex items-center gap-1.5 sm:gap-2.5 min-w-0">
<button aria-controls="sidebar" aria-expanded="false" aria-label="Open menu" class="lg:hidden h-9 w-9 shrink-0 rounded-lg flex items-center justify-center hover:bg-black/5 dark:hover:bg-white/5" id="sidebarToggle" type="button">
<i class="fa-solid fa-bars"></i>
</button>
<a class="flex items-center gap-2 sm:gap-2.5 shrink-0 min-w-0" href="index.html">
<div class="h-9 w-9 rounded-xl bg-primary flex items-center justify-center text-white shrink-0"><i class="fa-solid fa-layer-group text-sm"></i></div>
<span class="font-display font-bold text-lg hidden sm:inline truncate">CorPOS &amp; IMS</span>
</a>
</div>
<div class="flex items-center gap-1.5 sm:gap-3 ml-auto shrink-0">
<div class="flex items-center rounded-full p-0.5 text-xs font-semibold shrink-0" data-lang-toggle="" style="background:var(--bg-surface-alt); border:1px solid var(--border-subtle)"><button class="lang-toggle-btn px-2.5 py-1 rounded-full transition" data-lang-option="en" type="button">EN</button><button class="lang-toggle-btn px-2.5 py-1 rounded-full transition" data-lang-option="bn" type="button">বাং</button></div>
<button class="h-9 w-9 rounded-full flex items-center justify-center hover:bg-black/5 dark:hover:bg-white/5" onclick="toggleTheme()" title="Toggle dark mode">
<i class="fa-solid fa-moon dark:hidden"></i><i class="fa-solid fa-sun hidden dark:inline"></i>
</button>
<div class="flex items-center gap-2 sm:gap-2.5 pl-2 sm:pl-3 border-l" style="border-color:var(--border-subtle)">
<div class="h-9 w-9 rounded-full bg-primary/10 text-primary flex items-center justify-center font-semibold text-sm shrink-0" data-user-initial="">?</div>
<div class="hidden sm:block leading-tight">
<p class="text-sm font-semibold" data-user-name=""> </p>
<p class="text-xs" data-user-email="" style="color:var(--text-secondary)"> </p>
</div>
</div>
<button class="h-9 w-9 sm:h-auto sm:w-auto sm:px-3.5 sm:py-2 rounded-lg flex items-center justify-center hover:bg-black/5 dark:hover:bg-white/5 text-sm font-medium" data-logout="" style="color:var(--text-secondary)" title="Logout">
<i class="fa-solid fa-right-from-bracket sm:mr-1"></i><span class="hidden sm:inline">Logout</span></button>
</div>
</header>

<div class="flex items-start max-w-7xl mx-auto">
<div class="fixed inset-0 z-40 hidden bg-black/50 lg:hidden" id="sidebarBackdrop"></div>
<aside class="sidebar fixed lg:sticky inset-y-0 lg:inset-y-auto left-0 lg:top-[65px] z-50 lg:z-auto flex flex-col w-72 lg:w-60 shrink-0 h-full lg:h-auto lg:min-h-[calc(100vh-65px)] p-4 gap-1 -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out overflow-y-auto" id="sidebar" style="background:var(--bg-surface)">
<div class="flex items-center justify-between mb-2 lg:hidden">
<span class="font-display font-bold text-sm px-1">Menu</span>
<button aria-label="Close menu" class="h-8 w-8 rounded-lg flex items-center justify-center hover:bg-black/5 dark:hover:bg-white/5" id="sidebarClose" type="button"><i class="fa-solid fa-xmark"></i></button>
</div>

<a class="nav-link" data-nav="ai-assistant" href="ai-assistant.html"><i class="fa-solid fa-wand-magic-sparkles w-4 text-center"></i><span>AI Assistant</span></a>
<div class="my-2 border-t" style="border-color:var(--border-subtle)"></div>
<a class="nav-link" data-nav="settings" href="settings.html"><i class="fa-solid fa-gear w-4 text-center"></i><span>Settings</span></a>
</aside>

<main class="flex-1 min-w-0 px-4 sm:px-6 py-6 w-full">
<h1 class="font-display text-2xl font-bold mb-4">Point of Sale</h1>

<div class="grid lg:grid-cols-[1fr_360px] gap-6 items-start">
<!-- Product picker -->
<div>
<div class="relative mb-4">
<i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-sm" style="color:var(--text-secondary)"></i>
<input class="input-field pl-9" id="posSearch" placeholder="Search products by name or SKU..." type="text"/>
</div>
<div class="grid grid-cols-2 sm:grid-cols-3 gap-3" id="posProductGrid">
<p class="col-span-full text-sm py-6 text-center" style="color:var(--text-secondary)">Loading products...</p>
</div>
</div>

<!-- Cart -->
<div class="surface p-5 lg:sticky lg:top-[85px]">
<h2 class="font-display text-lg font-bold mb-3">Current Sale</h2>
<div class="max-h-[40vh] overflow-y-auto mb-3 -mx-1 px-1" id="cartItems">
<p class="text-sm py-4 text-center" style="color:var(--text-secondary)">Cart is empty. Tap a product to add it.</p>
</div>
<div class="border-t pt-3 space-y-2 text-sm mb-4" style="border-color:var(--border-subtle)">
<div class="flex items-center justify-between">
<span style="color:var(--text-secondary)">Subtotal</span>
<span class="font-mono-fig" id="cartSubtotal">৳0</span>
</div>
<div class="flex items-center justify-between gap-2">
<label style="color:var(--text-secondary)" for="cartDiscount">Discount (৳)</label>
<input class="input-field !w-24 !py-1.5 text-right font-mono-fig" id="cartDiscount" min="0" step="0.01" type="number" value="0"/>
</div>
<div class="flex items-center justify-between font-bold text-base pt-1">
<span>Total</span>
<span class="font-mono-fig" id="cartTotal">৳0</span>
</div>
</div>
<div class="mb-4">
<label class="block text-sm font-medium mb-1.5">Payment Method</label>
<select class="input-field" id="paymentMethod">
<option value="cash">Cash</option>
<option value="card">Card</option>
<option value="mobile_banking">Mobile Banking (bKash/Nagad)</option>
</select>
</div>
<button class="btn-primary w-full mb-2" disabled="" id="checkoutBtn"><i class="fa-solid fa-circle-check mr-1.5"></i>Checkout</button>
<button class="w-full text-sm py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5" id="clearCartBtn" style="color:var(--text-secondary)" type="button">Clear cart</button>
</div>
</div>
</main>
</div>

<!-- Success modal -->
<div class="fixed inset-0 z-50 hidden items-center justify-center p-4" id="saleSuccessModal" style="background:rgba(15,23,42,0.5)">
<div class="surface w-full max-w-sm p-6 text-center">
<div class="h-14 w-14 rounded-full bg-emerald/10 text-emerald flex items-center justify-center mx-auto mb-4 text-2xl"><i class="fa-solid fa-check"></i></div>
<h2 class="font-display text-lg font-bold mb-1">Sale Completed</h2>
<p class="text-sm mb-5" id="saleSuccessAmount" style="color:var(--text-secondary)"></p>
<button class="btn-primary w-full" id="saleSuccessOk" type="button">New Sale</button>
</div>
</div>

<script src="assets/js/main.js"></script>
<script src="assets/js/pos.js" type="module"></script>
<script src="assets/js/i18n.js"></script></body>
</html>
